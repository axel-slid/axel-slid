<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alex Dils</title>
  <desc id="desc">AI systems, biomedical vision, and agent-native tools</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090C18"/>
      <stop offset="0.52" stop-color="#11112B"/>
      <stop offset="1" stop-color="#071A24"/>
    </linearGradient>
    <linearGradient id="accent" x1="248" y1="73" x2="980" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 48) rotate(145) scale(430 275)">
      <stop stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(185 314) rotate(-30) scale(475 260)">
      <stop stop-color="#8B5CF6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="smallGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1280" height="320" fill="url(#background)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glowCyan)"/>
    <rect width="1280" height="320" fill="url(#glowViolet)"/>

    <g opacity=".38">
      <path d="M-58 252C105 153 233 336 397 227C537 134 657 248 794 162C934 73 1034 194 1328 40" stroke="url(#accent)" stroke-opacity=".38"/>
      <path d="M-57 273C105 174 238 352 403 247C549 153 664 270 807 183C947 98 1052 216 1334 63" stroke="url(#accent)" stroke-opacity=".22"/>
      <path d="M-54 294C107 195 243 370 410 268C559 176 675 291 820 204C961 119 1066 239 1337 88" stroke="url(#accent)" stroke-opacity=".12"/>
    </g>

    <g opacity=".68">
      <path d="M1020 75L1101 118L1188 65L1254 127" stroke="#22D3EE" stroke-opacity=".2"/>
      <path d="M1018 76L1062 174L1150 201L1253 127" stroke="#8B5CF6" stroke-opacity=".18"/>
      <path d="M1061 174L1101 118L1150 201L1188 65" stroke="#EC4899" stroke-opacity=".16"/>

      <g fill="#22D3EE">
        <circle cx="1020" cy="75" r="3"/>
        <circle cx="1101" cy="118" r="4"/>
        <circle cx="1188" cy="65" r="3"/>
        <circle cx="1254" cy="127" r="4"/>
      </g>
      <g fill="#8B5CF6">
        <circle cx="1062" cy="174" r="4"/>
        <circle cx="1150" cy="201" r="3"/>
      </g>
      <circle cx="1101" cy="118" r="11" fill="#22D3EE" opacity=".22" filter="url(#smallGlow)">
        <animate attributeName="opacity" values=".12;.42;.12" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(96 74)">
      <rect width="64" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="0" y="81" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">ALEX DILS</text>
      <text x="2" y="128" fill="#A5B4FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="500" letter-spacing="2.8">BUILDING INTELLIGENT TOOLS</text>
      <text x="2" y="172" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" letter-spacing=".4">AI systems  •  biomedical vision  •  agent-native software</text>
    </g>

    <g transform="translate(948 245)">
      <circle cx="0" cy="0" r="4" fill="#22D3EE"/>
      <circle cx="0" cy="0" r="13" fill="#22D3EE" opacity=".16" filter="url(#softGlow)">
        <animate attributeName="r" values="7;18;7" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".28;0;.28" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="17" y="6" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" letter-spacing=".7">BAY AREA, CA</text>
    </g>

    <rect x=".75" y=".75" width="1278.5" height="318.5" rx="27.25" stroke="url(#accent)" stroke-opacity=".28" stroke-width="1.5"/>
  </g>
</svg>
